<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ReflectAI - Gemini 초기 생성본</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>
body{font-family:'Noto Sans KR',sans-serif;background:#ffe6f1;color:#343a40;margin:0;padding:18px}
.app{max-width:460px;margin:10px auto;background:white;min-height:94vh;border-radius:8px;box-shadow:0 2px 12px #0002;overflow:hidden}
.top{background:#f8d7e8;padding:18px;text-align:center}
.brand{font-size:24px;font-weight:700;color:#d63384}
.navbar-lite{display:flex;background:#f8f9fa}
.navbar-lite button{border:0;background:transparent;flex:1;padding:13px 4px;color:#6c757d}
.navbar-lite button.active{color:#d63384;border-bottom:3px solid #d63384;font-weight:bold}
.panel{padding:18px;display:none}.panel.active{display:block}
.card-lite{border:1px solid #eee;border-radius:8px;padding:16px;margin:12px 0}
.calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;text-align:center}
.calendar span{padding:8px 0;background:#fff0f6;border-radius:4px;font-size:13px}
.calendar .head{background:#f8d7e8;font-weight:bold}
textarea{width:100%;min-height:95px;border:1px solid #ced4da;border-radius:5px;padding:10px}
.emoji button{border:1px solid #eee;background:white;border-radius:6px;font-size:22px;padding:5px}
.primary{background:#e83e8c;color:white;border:0;border-radius:5px;padding:10px 14px;width:100%}
.secondary{background:#f8d7e8;color:#a61e63;border:0;border-radius:5px;padding:10px 14px;width:100%}
#payModal{display:none;position:fixed;inset:0;background:#0008;align-items:center;justify-content:center;padding:20px}
#payBox{background:white;padding:22px;border-radius:8px;width:min(340px,100%)}
@media(max-width:360px){body{padding:0}.app{margin:0;width:100%;border-radius:0}}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="brand">🌸 ReflectAI</div>
    <div class="small text-secondary">당신의 하루를 기록하고 돌아보세요</div>
    <div class="badge rounded-pill text-bg-light mt-2">🔥 <span id="streak">0일 연속 기록 중</span></div>
  </header>
  <nav class="navbar-lite">
    <button class="active" onclick="showPanel('home',this)">홈</button>
    <button onclick="showPanel('write',this)">기록하기</button>
    <button onclick="showPanel('analysis',this)">감정 분석</button>
  </nav>
  <section id="home" class="panel active">
    <div class="text-center py-4">
      <div style="font-size:54px">🌷</div><h3>오늘의 나를 만나보세요</h3>
      <p class="text-secondary">작은 기록이 모여 나를 이해하는 시간이 됩니다.</p>
      <button class="primary mt-3" onclick="showPanel('write',document.querySelectorAll('.navbar-lite button')[1])">오늘의 기록 쓰기</button>
      <button class="secondary mt-2" onclick="showPanel('analysis',document.querySelectorAll('.navbar-lite button')[2])">감정 분석 보기</button>
    </div>
    <div class="card-lite"><strong>오늘의 기록 팁</strong><p class="small text-secondary mb-0 mt-2">하루 중 기억에 남는 순간을 편하게 적어보세요.</p></div>
    <button class="btn btn-outline-secondary btn-sm w-100" onclick="alert('ReflectAI 사용법: 날짜를 고르고 오늘의 감정을 기록해 보세요.')">튜토리얼 보기</button>
  </section>
  <section id="write" class="panel">
    <h5 class="mb-3">🗓️ 하루 기록</h5>
    <div class="d-flex justify-content-between align-items-center mb-2">
      <button class="btn btn-sm btn-outline-secondary" onclick="changeMonth(-1)">‹</button>
      <strong id="monthLabel">2024년 5월</strong>
      <button class="btn btn-sm btn-outline-secondary" onclick="changeMonth(1)">›</button>
    </div>
    <div class="calendar" id="calendar"></div>
    <div class="card-lite">
      <label class="form-label fw-bold">오늘 가장 기억에 남는 순간은?</label>
      <textarea id="entry1" placeholder="오늘 있었던 일을 적어보세요."></textarea>
      <label class="form-label fw-bold mt-3">오늘 나를 미소 짓게 한 것은?</label>
      <textarea id="entry2" placeholder="편하게 적어보세요."></textarea>
      <div class="fw-bold mt-3 mb-2">오늘의 감정</div>
      <div class="emoji d-flex justify-content-between"><button onclick="score=2">😍</button><button onclick="score=1">😊</button><button onclick="score=0">😐</button><button onclick="score=-1">😴</button><button onclick="score=-2">😢</button></div>
    </div>
    <button class="primary" onclick="saveEntry()">기록 저장하기</button>
    <div id="feedback" class="alert alert-light mt-3" style="display:none">기록이 저장되었어요. 오늘도 수고했어요 🌸</div>
  </section>
  <section id="analysis" class="panel">
    <h5>📈 감정 분석</h5>
    <div class="card-lite"><div class="fw-bold mb-2">감정 변화</div><canvas id="trend" height="190"></canvas></div>
    <div class="card-lite text-center">
      <div class="fw-bold">프리미엄 감정 리포트</div>
      <p class="small text-secondary">감정 기상도와 요일별 분석을 확인해 보세요.</p>
      <div class="fs-1">🔒</div><button class="primary" onclick="openPay()">프리미엄 잠금 해제</button>
    </div>
    <button class="secondary" onclick="alert('구글 로그인 시뮬레이터: 로그인 기능을 준비 중입니다.')">Google 로그인</button>
  </section>
</div>
<div id="payModal">
  <div id="payBox">
    <h5>프리미엄 결제하기</h5><p>ReflectAI 프리미엄 평생 소장권</p><h4 class="text-danger">9,900원</h4>
    <select class="form-select mb-3"><option>신용/체크카드</option><option>카카오페이</option><option>토스페이</option></select>
    <button class="primary" onclick="finishPay()">결제하기</button>
    <button class="btn btn-link w-100 mt-2" onclick="closePay()">닫기</button>
  </div>
</div>
<script>
let month=new Date(2024,4,1), score=0, records=[];
function showPanel(id,btn){
 document.querySelectorAll('.panel').forEach(x=>x.classList.remove('active'));
 document.getElementById(id).classList.add('active');
 document.querySelectorAll('.navbar-lite button').forEach(x=>x.classList.remove('active'));
 if(btn)btn.classList.add('active');
 if(id==='analysis')drawChart();
}
function drawCalendar(){
 const el=document.getElementById('calendar'); el.innerHTML='';
 ['일','월','화','수','목','금','토'].forEach(x=>el.innerHTML+=`<span class="head">${x}</span>`);
 document.getElementById('monthLabel').textContent=`${month.getFullYear()}년 ${month.getMonth()+1}월`;
 const first=new Date(month.getFullYear(),month.getMonth(),1).getDay();
 const days=new Date(month.getFullYear(),month.getMonth()+1,0).getDate();
 for(let i=0;i<first;i++)el.innerHTML+='<span style="background:white"></span>';
 for(let d=1;d<=days;d++)el.innerHTML+=`<span>${d}</span>`;
 // 초기 Gemini 시안에서는 날짜 클릭 이벤트가 일부 연결되지 않은 상태를 재현함.
}
function changeMonth(n){month.setMonth(month.getMonth()+n);drawCalendar();}
function saveEntry(){
 const a=document.getElementById('entry1').value,b=document.getElementById('entry2').value;
 records.push({date:new Date().toISOString().slice(0,10),text:a+' '+b,score});
 document.getElementById('streak').textContent=records.length+'일 기록 중';
 document.getElementById('feedback').style.display='block';
}
function drawChart(){
 const canvas=document.getElementById('trend');
 if(window.trendChart)window.trendChart.destroy();
 window.trendChart=new Chart(canvas,{type:'line',data:{labels:records.map(x=>x.date),datasets:[{label:'감정 변화',data:records.map(x=>x.score),borderColor:'#e83e8c'}]},options:{responsive:true}});
}
function openPay(){document.getElementById('payModal').style.display='flex';}
function closePay(){document.getElementById('payModal').style.display='none';}
function finishPay(){
 document.getElementById('payBox').innerHTML='<h5>결제 처리 중...</h5><p>잠시만 기다려 주세요.</p>';
 // 초기 시안에서는 결제 완료/잠금 해제 연결이 완성되지 않은 상태임.
}
drawCalendar();
</script>
</body>
</html>
